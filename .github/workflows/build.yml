name: Build and push to GHCR

# Baut nur bei einem bewusst gesetzten Versions-Tag (v*), nicht bei jedem
# Commit - passend zum Muster im dcsetup-Repo: ein neues Image ist immer
# ein bewusster, benannter Schritt, kein automatischer Rollout.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN kann nur Pakete beschreiben, die bereits mit DIESEM Repo
      # verknuepft sind - bei einem persoenlichen (Nicht-Org-)Account ist das
      # Verknuepfen nur ueber die Paket-Settings-UI moeglich, nicht per API.
      # `meshbot` wurde vor dieser Pipeline manuell gepusht und ist deshalb
      # nicht verknuepft (live 2026-09-19 als "permission_denied:
      # write_package" reproduziert, auch mit packages:write oben). Deshalb
      # ein echter PAT mit write:packages-Scope, unabhaengig von der
      # Repo-Verknuepfung - derselbe Token wie fuer die anderen manuell
      # gebauten Images in diesem Projekt.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/achildrenmile/meshbot:${{ github.ref_name }}
