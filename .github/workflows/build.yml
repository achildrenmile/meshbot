name: Build and push to GHCR

# Baut nur bei einem bewusst gesetzten Versions-Tag (v*), nicht bei jedem
# Commit - passend zum Muster im dcsetup-Repo: ein neues Image ist immer
# ein bewusster, benannter Schritt, kein automatischer Rollout.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/achildrenmile/meshbot:${{ github.ref_name }}
