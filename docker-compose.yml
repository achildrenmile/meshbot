name: meshbot

# Ein Dienst, kein Traefik: Der Bot spricht nur MQTT, nichts davon geht ins Web.
# Der Healthcheck bleibt containerintern.
#
# Kein eigenes Netz: Der Broker laeuft auf einem anderen Host, erreicht wird er
# ueber das LAN. Wer den Bot neben den Broker stellt, kann stattdessen dessen
# Compose-Netz einhaengen.

services:
  meshbot:
    build: .
    image: meshbot:local
    container_name: meshbot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Meldungen aus dem Funknetz muessen einen Neustart ueberleben.
      - meldungen:/data
    # Der Watchdog im meshcore-Stack auf demselben Host greift ueber diese
    # Labels. Er ist die zweite Linie unter `restart: unless-stopped` -- am
    # 28.8.2026 hat die erste nachweislich nicht gegriffen: Nach einem
    # Stromausfall stand der Broker auf Exit 255 bei RestartCount 0, Docker
    # hatte es also nicht ein einziges Mal versucht.
    #
    # `watchdog: true`       -> neu starten, wenn ungesund. Seit /healthz bei
    #                           fehlender MQTT-Verbindung 503 liefert, heisst
    #                           "ungesund" auch wirklich "antwortet nicht mehr".
    # `watchdog.start: true` -> ueberhaupt starten, wenn beendet.
    labels:
      meshinfra.watchdog: "true"
      meshinfra.watchdog.start: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  meldungen:
